<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#00e5ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neon Pursuit" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Neon Pursuit</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Neon Pursuit game viewport"></canvas>
      <div id="topbar" class="glass">
        <div class="brand">
          <span class="brand-mark">NP</span>
          <div><strong>NEON PURSUIT</strong><span id="renderer-label">INITIALIZING</span></div>
        </div>
        <button id="install-button" class="install hidden" type="button">INSTALL</button>
      </div>
      <div id="hud">
        <div class="speed-stack">
          <div><span id="speed">000</span><small>KM/H</small></div>
          <div class="gear">GEAR <strong id="gear">1</strong></div>
        </div>
        <div class="pursuit glass"><span>HEAT</span><div id="heat-pips" class="heat-pips"></div></div>
        <div class="nitrous glass"><span>NITROUS</span><div class="nitro-track"><div id="nitro-fill"></div></div></div>
      </div>
      <div id="start-card" class="start-card glass">
        <p class="eyebrow">VERTICAL SLICE 0.1</p>
        <h1>OWN THE NIGHT.</h1>
        <p>WASD / arrows to drive. Space to handbrake. Shift for nitrous. Gamepads and touch controls are supported.</p>
        <button id="drive-button" type="button">DRIVE</button>
      </div>
      <div id="touch-controls" aria-hidden="true">
        <div class="touch-steer">
          <button data-control="left" aria-label="Steer left">◀</button>
          <button data-control="right" aria-label="Steer right">▶</button>
        </div>
        <div class="touch-pedals">
          <button data-control="brake" class="brake" aria-label="Brake">BRAKE</button>
          <button data-control="nitro" class="nitro" aria-label="Nitrous">N₂O</button>
          <button data-control="throttle" class="throttle" aria-label="Accelerate">GO</button>
        </div>
      </div>
      <div id="offline-badge" class="offline-badge hidden">OFFLINE MODE</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
