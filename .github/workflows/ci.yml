name: CI

on:
  push:
    branches: [main, 'feat/**', 'agent/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Studio smoke checks
        run: npm run smoke

      - name: Typecheck and build
        run: npm run build

      - name: Retain production build
        uses: actions/upload-artifact@v4
        with:
          name: neon-pursuit-${{ github.sha }}
          path: dist
          retention-days: 14
